name: Build diagnostic KPM

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - restart/verified-kpm-build
  workflow_dispatch:

concurrency:
  group: diagnostic-kpm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KP_REPOSITORY: KernelSU-Next/KPatch-Next
  KP_COMMIT: 0fe6d142266b80e5aa445a7ea1534f88a8f33a35
  ARM_TOOLCHAIN_URL: https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
  ARM_TOOLCHAIN_SHA256: 62d66e0ad7bd7f2a183d236ee301a5c73c737c886c7944aa4f39415aab528daf
  MODULE_DIR: modules/diagnostic-hello
  ARTIFACT_NAME: patchnest-diagnostic-hello.kpm

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Validate catalog and closed diagnostic build graph
        run: |
          set -euo pipefail
          node scripts/validate.js
          node scripts/validate-build-graph.js
          node - <<'NODE'
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync('modules/diagnostic-hello/module.json', 'utf8'));
          if (metadata.upstreamSdk.commit !== process.env.KP_COMMIT) {
            throw new Error('metadata SDK commit does not match workflow pin');
          }
          if (metadata.installable !== false || metadata.channel !== 'build-only') {
            throw new Error('diagnostic module must remain build-only and non-installable');
          }
          NODE

      - name: Capture immutable source identity
        env:
          SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_NAME: ${{ github.repository }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git diff --quiet HEAD --
          git diff --cached --quiet
          tested_commit=$(git rev-parse HEAD)
          git cat-file -e "${SOURCE_HEAD_COMMIT}^{commit}"
          if [ -n "$BASE_COMMIT" ]; then
            git cat-file -e "${BASE_COMMIT}^{commit}"
          fi
          {
            echo "PATCHNEST_SOURCE_HEAD_COMMIT=$SOURCE_HEAD_COMMIT"
            echo "PATCHNEST_BASE_COMMIT=$BASE_COMMIT"
            echo "PATCHNEST_TESTED_COMMIT=$tested_commit"
            echo "PATCHNEST_EVENT_NAME=$EVENT_NAME"
            echo "PATCHNEST_REPOSITORY=$REPOSITORY_NAME"
            echo "PATCHNEST_WORKFLOW_REF=$WORKFLOW_REF_VALUE"
            echo "PATCHNEST_RUN_ID=$RUN_ID_VALUE"
          } >> "$GITHUB_ENV"

      - name: Clone pinned KernelPatch SDK
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${KP_REPOSITORY}.git" "$RUNNER_TEMP/kpatch-next"
          git -C "$RUNNER_TEMP/kpatch-next" checkout --detach "$KP_COMMIT"
          test "$(git -C "$RUNNER_TEMP/kpatch-next" rev-parse HEAD)" = "$KP_COMMIT"
          test -f "$RUNNER_TEMP/kpatch-next/kernel/include/kpmodule.h"

      - name: Download and verify Arm toolchain
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arm-toolchain.tar.xz"
          root="$RUNNER_TEMP/arm-toolchain"
          curl -fL --retry 3 --retry-delay 2 "$ARM_TOOLCHAIN_URL" -o "$archive"
          echo "$ARM_TOOLCHAIN_SHA256  $archive" | sha256sum -c -
          mkdir -p "$root"
          tar -xf "$archive" -C "$root"
          prefix="$root/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-"
          test -x "${prefix}gcc"
          echo "TARGET_COMPILE=$prefix" >> "$GITHUB_ENV"

      - name: Build diagnostic KPM
        run: |
          set -euo pipefail
          make -C "$MODULE_DIR" clean
          make -C "$MODULE_DIR" \
            TARGET_COMPILE="$TARGET_COMPILE" \
            KP_DIR="$RUNNER_TEMP/kpatch-next"
          test -s "$MODULE_DIR/$ARTIFACT_NAME"
          test -s "$MODULE_DIR/patchnest-diagnostic-hello.map"

      - name: Inspect relocatable ARM64 artifact and symbol allowlist
        run: |
          set -euo pipefail
          artifact="$MODULE_DIR/$ARTIFACT_NAME"
          description=$(file "$artifact")
          echo "$description"
          printf '%s' "$description" | grep -q 'ELF 64-bit'

          readelf -h "$artifact" | tee "$MODULE_DIR/elf-header.txt"
          readelf -SW "$artifact" | tee "$MODULE_DIR/sections.txt"
          readelf -sW "$artifact" | tee "$MODULE_DIR/symbols.txt"
          readelf -rW "$artifact" | tee "$MODULE_DIR/relocations.txt"
          readelf -Ws "$artifact" | awk '$7 == "UND" && $8 != "" {print $8}' | sort -u \
            > "$MODULE_DIR/undefined-symbols.txt"

          readelf -h "$artifact" | grep -Eq 'Type:[[:space:]]+REL'
          readelf -h "$artifact" | grep -Eq 'Machine:[[:space:]]+AArch64'
          strings "$artifact" | grep -Fx 'patchnest-diagnostic-hello'
          strings "$artifact" | grep -Fx '0.1.0'
          strings "$artifact" | grep -Fx 'patchnest-diagnostic-ok'

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          module = Path('modules/diagnostic-hello')
          lines = (module / 'sections.txt').read_text().splitlines()
          pattern = re.compile(
              r'^\s*\[\s*\d+\]\s+\S+\s+\S+\s+'
              r'[0-9a-fA-F]+\s+[0-9a-fA-F]+\s+[0-9a-fA-F]+\s+'
              r'\S+\s+(\S*)'
          )
          for line in lines:
              match = pattern.match(line)
              if match and 'W' in match.group(1) and 'X' in match.group(1):
                  raise SystemExit(f'writable-executable KPM section: {line}')

          metadata = json.loads((module / 'module.json').read_text())
          allowed = set(metadata['buildGraph']['allowedUndefinedSymbols'])
          actual = {line.strip() for line in (module / 'undefined-symbols.txt').read_text().splitlines() if line.strip()}
          unexpected = sorted(actual - allowed)
          if unexpected:
              raise SystemExit('unexpected undefined symbols: ' + ', '.join(unexpected))
          PY

          if grep -Eq 'R_AARCH64_(JUMP_SLOT|GLOB_DAT)' "$MODULE_DIR/relocations.txt"; then
            echo '::error::Unexpected dynamic-linker relocation in KPM'
            exit 1
          fi

      - name: Generate reproducible provenance manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          module = Path('modules/diagnostic-hello')
          metadata = json.loads((module / 'module.json').read_text())
          artifact = module / os.environ['ARTIFACT_NAME']
          map_file = module / metadata['buildGraph']['mapFile']

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          declared = [
              {'path': item, 'sha256': digest(Path(item))}
              for item in metadata['buildGraph']['declaredInputs']
          ]
          objects = [
              {'path': str(module / item), 'sha256': digest(module / item)}
              for item in metadata['buildGraph']['objects']
          ]
          undefined = [
              line.strip() for line in (module / 'undefined-symbols.txt').read_text().splitlines()
              if line.strip()
          ]
          base = os.environ.get('PATCHNEST_BASE_COMMIT') or None
          provenance = {
              'schemaVersion': 2,
              'artifact': artifact.name,
              'sha256': digest(artifact),
              'size': artifact.stat().st_size,
              'sourceHeadCommit': os.environ['PATCHNEST_SOURCE_HEAD_COMMIT'],
              'baseCommit': base,
              'testedMergeCommit': os.environ['PATCHNEST_TESTED_COMMIT'],
              'sourceTreeStatus': 'clean',
              'eventName': os.environ['PATCHNEST_EVENT_NAME'],
              'repository': os.environ['PATCHNEST_REPOSITORY'],
              'workflowRef': os.environ['PATCHNEST_WORKFLOW_REF'],
              'runId': os.environ['PATCHNEST_RUN_ID'],
              'sdkRepository': os.environ['KP_REPOSITORY'],
              'sdkCommit': os.environ['KP_COMMIT'],
              'toolchain': 'arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf',
              'toolchainSha256': os.environ['ARM_TOOLCHAIN_SHA256'],
              'declaredInputDigests': declared,
              'objectDigests': objects,
              'linkMap': {'path': str(map_file), 'sha256': digest(map_file)},
              'undefinedSymbols': undefined,
              'installable': False,
              'deviceValidated': False,
          }
          (module / 'build-provenance.json').write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + '\n'
          )
          PY
          cat "$MODULE_DIR/build-provenance.json"

      - name: Upload build-only diagnostic artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: diagnostic-kpm-${{ github.sha }}
          path: |
            modules/diagnostic-hello/patchnest-diagnostic-hello.kpm
            modules/diagnostic-hello/patchnest-diagnostic-hello.map
            modules/diagnostic-hello/build-provenance.json
            modules/diagnostic-hello/elf-header.txt
            modules/diagnostic-hello/sections.txt
            modules/diagnostic-hello/symbols.txt
            modules/diagnostic-hello/relocations.txt
            modules/diagnostic-hello/undefined-symbols.txt
          if-no-files-found: error
          retention-days: 14
