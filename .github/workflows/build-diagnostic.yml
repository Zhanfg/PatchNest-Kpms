name: Build diagnostic KPM

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - restart/verified-kpm-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KP_REPOSITORY: KernelSU-Next/KPatch-Next
      KP_COMMIT: 0fe6d142266b80e5aa445a7ea1534f88a8f33a35
      ARM_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
      ARM_TOOLCHAIN_SHA256: 62d66e6c97e37c0d7b42a90938e88d7a80016bda8681c53f3fb09876b7889a82
      MODULE_DIR: modules/diagnostic-hello
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record immutable source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)" || {
            echo '::error::Source checkout is dirty before validation'
            exit 1
          }
          source_head=${PR_HEAD_SHA:-$GITHUB_SHA}
          base_commit=${PR_BASE_SHA:-}
          printf 'PATCHNEST_SOURCE_HEAD=%s\n' "$source_head" >> "$GITHUB_ENV"
          printf 'PATCHNEST_BASE_COMMIT=%s\n' "$base_commit" >> "$GITHUB_ENV"
          printf 'PATCHNEST_SOURCE_TREE_STATUS=clean\n' >> "$GITHUB_ENV"
          printf 'tested checkout: %s\n' "$(git rev-parse HEAD)"
          printf 'source head: %s\n' "$source_head"
          printf 'base: %s\n' "${base_commit:-<none>}"

      - name: Validate declared source/build graph before network access
        run: |
          set -euo pipefail
          python3 scripts/validate_diagnostic_build.py --mode source
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('modules/diagnostic-hello/module.json').read_text())
          assert data['upstreamSdk']['repository'] == os.environ['KP_REPOSITORY']
          assert data['upstreamSdk']['commit'] == os.environ['KP_COMMIT']
          PY

      - name: Checkout pinned KPatch SDK
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/${KP_REPOSITORY}.git "$RUNNER_TEMP/kpatch-next"
          git -C "$RUNNER_TEMP/kpatch-next" checkout --detach "$KP_COMMIT"
          test "$(git -C "$RUNNER_TEMP/kpatch-next" rev-parse HEAD)" = "$KP_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/kpatch-next" status --porcelain --untracked-files=all)"

      - name: Install pinned ARM GNU toolchain
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arm-toolchain.tar.xz"
          curl --fail --location --retry 3 "$ARM_TOOLCHAIN_URL" --output "$archive"
          printf '%s  %s\n' "$ARM_TOOLCHAIN_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          prefix=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'arm-gnu-toolchain-*-x86_64-aarch64-none-elf' -print -quit)
          test -n "$prefix"
          printf 'TARGET_COMPILE=%s/bin/aarch64-none-elf-\n' "$prefix" >> "$GITHUB_ENV"

      - name: Build declared diagnostic module
        run: |
          set -euo pipefail
          make -C "$MODULE_DIR" clean
          make -C "$MODULE_DIR" \
            TARGET_COMPILE="$TARGET_COMPILE" \
            KP_DIR="$RUNNER_TEMP/kpatch-next"
          test -s "$MODULE_DIR/patchnest-diagnostic-hello.kpm"
          test -s "$MODULE_DIR/diagnostic_hello.d"
          test -s "$MODULE_DIR/diagnostic_hello.map"

      - name: Inspect final ELF and actual build inputs
        run: |
          set -euo pipefail
          artifact="$MODULE_DIR/patchnest-diagnostic-hello.kpm"
          readelf="${TARGET_COMPILE}readelf"
          "$readelf" -hW "$artifact" > "$MODULE_DIR/elf-header.txt"
          "$readelf" -SW "$artifact" > "$MODULE_DIR/sections.txt"
          "$readelf" -sW "$artifact" > "$MODULE_DIR/symbols.txt"
          "$readelf" -rW "$artifact" > "$MODULE_DIR/relocations.txt"

          grep -Eq 'Type:[[:space:]]+REL' "$MODULE_DIR/elf-header.txt"
          grep -Eq 'Machine:[[:space:]]+AArch64' "$MODULE_DIR/elf-header.txt"
          if awk '$0 ~ / WAX | AXW | WA[X]/ { bad=1 } END { exit bad ? 0 : 1 }' "$MODULE_DIR/sections.txt"; then
            echo '::error::Diagnostic KPM contains a writable+executable section'
            exit 1
          fi
          if grep -Eq 'R_AARCH64_(JUMP_SLOT|GLOB_DAT|COPY)' "$MODULE_DIR/relocations.txt"; then
            echo '::error::Diagnostic KPM contains dynamic-linker relocation types'
            exit 1
          fi

          python3 scripts/validate_diagnostic_build.py \
            --mode artifact \
            --readelf "$readelf" \
            --output "$MODULE_DIR/build-inputs.json"

      - name: Write unambiguous build provenance
        run: |
          set -euo pipefail
          python3 scripts/write_build_provenance.py \
            --artifact "$MODULE_DIR/patchnest-diagnostic-hello.kpm" \
            --inputs "$MODULE_DIR/build-inputs.json" \
            --output "$MODULE_DIR/build-provenance.json"

      - name: Verify provenance semantics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('modules/diagnostic-hello/build-provenance.json').read_text())
          assert p['schemaVersion'] == 2
          assert p['sourceHeadCommit'] == os.environ['PATCHNEST_SOURCE_HEAD']
          assert p['testedCommit'] == os.environ['GITHUB_SHA']
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              assert p['baseCommit'] == os.environ['PATCHNEST_BASE_COMMIT']
              assert p['testedMergeCommit'] == os.environ['GITHUB_SHA']
          else:
              assert p['baseCommit'] is None
              assert p['testedMergeCommit'] is None
          PY

      - name: Upload build-only diagnostic evidence
        uses: actions/upload-artifact@v6
        with:
          name: patchnest-diagnostic-${{ github.sha }}
          path: |
            modules/diagnostic-hello/patchnest-diagnostic-hello.kpm
            modules/diagnostic-hello/diagnostic_hello.d
            modules/diagnostic-hello/diagnostic_hello.map
            modules/diagnostic-hello/build-inputs.json
            modules/diagnostic-hello/build-provenance.json
            modules/diagnostic-hello/elf-header.txt
            modules/diagnostic-hello/sections.txt
            modules/diagnostic-hello/symbols.txt
            modules/diagnostic-hello/relocations.txt
          if-no-files-found: error
          retention-days: 14
