name: Validate KPM catalog

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'restart/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run offline catalog contract tests
        run: node scripts/test-contract.js

      - name: Validate catalog and draft inventory
        run: node scripts/validate.js

      - name: Verify source-bearing release assets
        run: node scripts/verify-release-assets.js

      - name: Reject checked-in release binaries
        run: |
          set -euo pipefail
          tracked=$(git ls-files '*.ko' '*.kpm' '*.zip' '*.sig')
          if [ -n "$tracked" ]; then
            printf '%s\n' "$tracked"
            echo "::error::Release binaries and signatures belong in GitHub Releases, not the source tree"
            exit 1
          fi

      - name: Reject installable Linux-module sources
        run: |
          set -euo pipefail
          installable=$(node -e "for (const m of require('./kpm_repo.json').modules) console.log(m.source || '')")
          while IFS= read -r source; do
            [ -z "$source" ] && continue
            if grep -Eq 'module_init\(|module_exit\(|MODULE_LICENSE\(' "$source"; then
              echo "::error file=$source::Installable entries must use KernelPatch KPM interfaces, not Linux module_init/module_exit"
              exit 1
            fi
            for macro in KPM_NAME KPM_VERSION KPM_LICENSE KPM_INIT KPM_EXIT; do
              grep -q "${macro}(" "$source" || {
                echo "::error file=$source::Missing ${macro} metadata or entry point"
                exit 1
              }
            done
          done <<< "$installable"

      - name: Write validation summary
        run: |
          installable=$(node -p "require('./kpm_repo.json').modules.length")
          drafts=$(node -p "require('./drafts.json').drafts.length")
          {
            echo '## PatchNest KPM catalog validation'
            echo
            echo "- Installable modules: ${installable}"
            echo "- Isolated drafts: ${drafts}"
            echo '- Catalog schema: version 2'
            echo '- Offline contract fixtures: passed'
            echo '- Release assets: source/tag/hash verification passed'
          } >> "$GITHUB_STEP_SUMMARY"
